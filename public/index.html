<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do App</title>
    <link rel="stylesheet" href="styles/base.css" /> 
    <link rel="stylesheet" href="styles/tasks.css" /> 
    <link rel="stylesheet" href="styles/filters.css" /> 
    <link rel="stylesheet" href="styles/notifications.css" /> 
    <link rel="stylesheet" href="styles/theme.css" /> 
    <link rel="stylesheet" href="styles/draganddrop.css" /> 
    <link rel="stylesheet" href="styles/deadline.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Pangolin&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <h1>Ma To-Do List</h1>
      <input type="text" id="taskInput" placeholder="Nouvelle tâche" />
      <div class="deadline-container">
        <label for="deadlineInput" class="deadline-label"
          >Ajouter une deadline (optionnel)</label
        >
        <input type="date" id="deadlineInput" />
      </div>
      <button id="addTaskBtn">Ajouter</button>
      <ul id="taskList"></ul>
    </div>
    <script src="script.js"></script>
  </body>
</html>
